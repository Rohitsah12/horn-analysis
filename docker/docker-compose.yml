# Infrastructure for the Horn Analysis project.
# Services are commented out by phase — uncomment as you reach each phase.
#
# Phase 2: Kafka + Zookeeper
# Phase 3: Redis + MongoDB
#
# Usage:  docker compose up -d        (start all enabled services)
#         docker compose down         (stop)
#         docker compose ps           (status)

